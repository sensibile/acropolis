name: Checks
on:
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Install pinned Ruff
        run: |
          python3 -m venv .cache/dev-tools
          .cache/dev-tools/bin/python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Configuration checks
        run: python3 ./scripts/check-config
      - name: Python format and static checks
        run: CHECK_PYTHON_FORMAT=check ./scripts/check-python
      - name: Push boundary tests
        run: python3 ./scripts/test-push-boundary
      - name: Documentation gate tests
        run: python3 ./scripts/test-documentation-gate
